name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    # Production runs on PostgreSQL, so the database tests run on it too
    # (tests/conftest.py fails them in CI if TEST_DATABASE_URL is missing)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lunalab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lunalab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"   # matches runtime.txt
          cache: pip
      - run: pip install -r requirements.txt pytest-github-actions-annotate-failures
      # E2E tests skip themselves here: Playwright is not installed in this job
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: unit-and-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      # The annotate plugin turns each failure into a GitHub annotation, readable
      # in the run summary without downloading logs
      - run: pip install -r requirements.txt playwright pytest-github-actions-annotate-failures
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -v
