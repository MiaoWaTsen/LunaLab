# Mutation testing: `mutmut run` mutates the crater model (the core) and
# checks that the tests notice each change.  `mutmut results` lists the
# mutants that survived.
[mutmut]
paths_to_mutate = simulation/crater_model.py
tests_dir = tests/
also_copy =
    backend/
    database/
    terrain/
    frontend/
    main.py
    simulation/challenges.py
    simulation/lunar_ephemeris.py

[tool:pytest]
# Keep pytest out of mutmut's mutants/ copy of the project
testpaths = tests
