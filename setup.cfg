# Mutation testing: `mutmut run` mutates the science modules and checks
# that the tests notice each change.  `mutmut results` lists the mutants
# that survived.
[mutmut]
source_paths =
    simulation/crater_model.py
    simulation/case_studies.py
    simulation/inference.py
    simulation/chronology.py
    simulation/surface_dating.py
pytest_add_cli_args_test_selection = tests/
also_copy =
    backend/
    database/
    terrain/
    frontend/
    scripts/
    main.py
    simulation/challenges.py
    simulation/lunar_ephemeris.py
    simulation/data/

[tool:pytest]
# Keep pytest out of mutmut's mutants/ copy of the project
testpaths = tests
